<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>準2級漢字トレーニング PDF版5</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4f6f8;font-family:"Yu Gothic","Meiryo",sans-serif;color:#222}
.container{max-width:980px;min-height:calc(100vh - 24px);margin:auto;padding:18px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.1)}
h1{text-align:center;font-size:24px;line-height:1.4;margin:8px 0 6px}
.subtitle{text-align:center;color:#555;line-height:1.6;font-size:15px}
label{display:block;margin-top:14px;font-weight:bold;font-size:16px}
select{width:100%;margin-top:6px;padding:14px;font-size:17px;border:1px solid #bbb;border-radius:10px;background:#fff}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.secondary{background:#555}
.light{background:#e5e7eb;color:#222}
.danger{background:#dc2626}
.green{background:#047857}
.note{margin-top:18px;padding:12px;border-left:6px solid #f97316;border-radius:8px;background:#fff7ed;color:#444;font-size:14px;line-height:1.7}
.memory{margin-top:12px;padding:12px;border-left:6px solid #2563eb;border-radius:8px;background:#eff6ff;color:#333;font-size:14px;line-height:1.7}
.hidden{display:none}
.header{margin-top:12px;padding:14px;border:2px solid #222;border-radius:10px;background:#fafafa;line-height:1.8}
.badge{display:inline-block;margin-left:6px;padding:3px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:14px;font-weight:bold}
.retest-badge{background:#fee2e2;color:#b91c1c}
.progress{margin-top:14px;text-align:center;font-weight:bold}
.card{margin-top:14px;padding:22px 16px;min-height:320px;border:2px solid #2563eb;border-radius:18px;background:#eef4ff;display:flex;flex-direction:column;justify-content:center}
.num{text-align:center;font-size:20px;font-weight:bold;margin-bottom:12px}
.label2{text-align:center;margin-bottom:10px;color:#1d4ed8;font-weight:bold}
.question{font-size:clamp(24px,6.2vw,40px);font-weight:bold;line-height:1.7;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.target{color:#dc2626;text-decoration:underline;text-underline-offset:6px}
.line{width:86%;height:44px;margin:24px auto 0;border-bottom:3px solid #333}
.answer{margin-top:16px;padding:16px;border:2px solid #047857;border-radius:14px;background:#ecfdf5;text-align:center}
.answer-main{font-size:clamp(32px,10vw,64px);font-weight:bold;line-height:1.4;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.answer-sub{margin-top:8px;font-size:18px;line-height:1.7;text-align:left}
.answer-sub strong{color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row button{margin-top:0}
.box{margin-top:16px;padding:14px;border:2px solid #2563eb;border-radius:12px;background:#eef4ff}
.missbox{border-color:#dc2626;background:#fff1f2}
.list{display:grid;grid-template-columns:1fr;gap:10px;font-size:16px;line-height:1.6}
.item{padding:10px;background:white;border:1px solid #cbd5e1;border-radius:8px}
.item-kanji{font-size:28px;font-weight:bold;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.small{font-size:14px;color:#555}
@media(min-width:720px){
.container{padding:28px}
button{width:auto;min-width:160px;margin-right:8px}
.start{width:100%}
.row button{width:100%}
.list{grid-template-columns:1fr 1fr}
}
</style>

<div class="container">
<h1>準2級 漢字トレーニング<br>PDF内容版5</h1>
<p class="subtitle">PDFの124〜127ページの内容をもとに、読み・書きだけで練習できます。</p>

<div id="settingBox">
<label>出題範囲</label>
<select id="rangeSelect">
  <option value="all" selected>4ページすべて</option>
  <option value="124">124ページ（第13回 前半）</option>
  <option value="125">125ページ（第13回 後半）</option>
  <option value="126">126ページ（第14回 前半）</option>

  <option value="第14回">第14回 全体</option>
</select>

<label>出題モード</label>
<select id="modeSelect">
  <option value="read" selected>読み</option>
  <option value="write">書き</option>
</select>

<label>問題数</label>
<select id="countSelect">
  <option value="5">5問</option>
  <option value="10" selected>10問</option>
  <option value="20">20問</option>
  <option value="30">30問</option>
  <option value="50">50問</option>
  <option value="all">全問</option>
</select>

<label>出題順</label>
<select id="orderSelect">
  <option value="random" selected>ランダム</option>
  <option value="normal">表の順番</option>
</select>

<div id="memoryInfo" class="memory"></div>

<button class="start" onclick="makeTest(false)">通常テストを作る</button>
<button class="danger start" onclick="makeTest(true)">間違えたものだけ再テスト</button>
<button class="light start" onclick="clearStoredMisses()">間違えた記録をリセット</button>

<div class="note">
「読み」では、基本練習・実戦練習の文章からまとめて出題されます。文章中の【漢字・語句】の読みを書きます。<br>
「書き」では、基本練習・実戦練習の文章からまとめて出題されます。文章中の【カタカナ・ひらがな】を漢字に直します。<br>
答えを確認して間違っていたら「間違えたものに追加」を押してください。
</div>
</div>

<div id="testArea" class="hidden">
  <div class="header">
    <strong>準2級 漢字トレーニング</strong>
    <span id="modeBadge" class="badge"></span>
    <span id="rangeBadge" class="badge"></span>
    <span id="retestBadge" class="badge retest-badge hidden">再テスト</span>
    <div id="instruction"></div>
  </div>

  <div id="progress" class="progress"></div>

  <div class="card">
    <div id="num" class="num"></div>
    <div id="label2" class="label2"></div>
    <div id="question" class="question"></div>
    <div class="line"></div>
  </div>

  <div id="answerBox" class="answer hidden">
    <div>答え</div>
    <div id="answerMain" class="answer-main"></div>
    <div id="answerSub" class="answer-sub"></div>
  </div>

  <button onclick="toggleAnswer()">この問題の答えを表示／非表示</button>

  <div class="row">
    <button class="danger" onclick="markCurrentMiss()">間違えたものに追加</button>
    <button class="green" onclick="removeCurrentMiss()">覚えたので削除</button>
  </div>

  <div class="row">
    <button class="light" onclick="prevQuestion()">前の問題</button>
    <button onclick="nextQuestion()">次の問題</button>
  </div>

  <div>
    <button class="secondary" onclick="makeTest(false)">通常テストを作る</button>
    <button class="danger" onclick="makeTest(true)">間違えたものだけ再テスト</button>
    <button class="secondary" onclick="toggleAllList()">全データを表示／非表示</button>
    <button class="secondary" onclick="toggleMisses()">保存中の間違いを表示／非表示</button>
    <button class="light" onclick="backToSetting()">設定に戻る</button>
  </div>

  <div id="allBox" class="box hidden">
    <h2>全データ</h2>
    <div id="allList" class="list"></div>
  </div>

  <div id="missBox" class="box missbox hidden">
    <h2>保存中の間違い</h2>
    <div id="missList" class="list"></div>
  </div>
</div>
</div>

 "沸", "readings": "フツ／わく・わかす", "word": "沸騰", "reading": "ふっとう", "sentence": "【フットウ】したら弱火にする。", "answer": "沸騰"}, {"id": 148, "sourceId": 37, "page": "127", "lesson": "第14回", "mode": "write", "kind": "実戦", "kanji": "沸", "readings": "フツ／わく・わかす", "word": "沸く", "reading": "わく", "sentence": "逆転劇に場内が【ワ】く。", "answer": "沸く"}, {"id": 149, "sourceId": 38, "page": "127", "lesson": "第14回", "mode": "read", "kind": "基本", "kanji": "雰", "readings": "フン", "word": "雰囲気", "reading": "ふんいき", "sentence": "家庭的な【雰囲気】の旅館に泊まる。", "answer": "ふんいき"}, {"id": 150, "sourceId": 38, "page": "127", "lesson": "第14回", "mode": "read", "kind": "実戦", "kanji": "雰", "readings": "フン", "word": "雰囲気", "reading": "ふんいき", "sentence": "家庭的な【雰囲気】の旅館に泊まる。", "answer": "ふんいき"}, {"id": 151, "sourceId": 38, "page": "127", "lesson": "第14回", "mode": "write", "kind": "基本", "kanji": "雰", "readings": "フン", "word": "雰囲気", "reading": "ふんいき", "sentence": "家庭的な【フンイキ】の旅館に泊まる。", "answer": "雰囲気"}, {"id": 152, "sourceId": 38, "page": "127", "lesson": "第14回", "mode": "write", "kind": "実戦", "kanji": "雰", "readings": "フン", "word": "雰囲気", "reading": "ふんいき", "sentence": "家庭的な【フンイキ】の旅館に泊まる。", "answer": "雰囲気"}];
const STORAGE_KEY = "kanji_pdf_124_127_read_write_miss_v1";
let currentQuestions = [];
let currentIndex = 0;
let currentMode = "read";

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getMissKeys() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}

function setMissKeys(keys) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...new Set(keys)]));
  updateMemoryInfo();
  showMisses();
}

function getMissItems() {
  const keys=getMissKeys();
  return questions.filter(q => keys.includes(q.id));
}

function addMiss(q) {
  const keys=getMissKeys();
  if(!keys.includes(q.id)) keys.push(q.id);
  setMissKeys(keys);
}

function removeMiss(q) {
  setMissKeys(getMissKeys().filter(k => k !== q.id));
}

function clearStoredMisses() {
  if(confirm("保存中の間違いをすべて削除しますか。")) {
    localStorage.removeItem(STORAGE_KEY);
    updateMemoryInfo();
    showMisses();
  }
}

function updateMemoryInfo() {
  const n = getMissItems().length;
  const el = document.getElementById("memoryInfo");
  if(el) el.textContent = "現在保存されている間違い：" + n + "件";
}

function getFilteredSource(retest) {
  const range = document.getElementById("rangeSelect").value;
  currentMode = document.getElementById("modeSelect").value;

  let source = retest ? getMissItems() : questions;
  source = source.filter(q => q.mode === currentMode);

  if(range === "第13回" || range === "第14回") {
    source = source.filter(q => q.lesson === range);
  } else if(range !== "all") {
    source = source.filter(q => q.page === range);
  }
  return source;
}

function makeTest(retest) {
  const countValue = document.getElementById("countSelect").value;
  const order = document.getElementById("orderSelect").value;

  let source = getFilteredSource(retest);
  if(retest && source.length === 0) {
    alert("この条件には保存中の間違いがありません。");
    return;
  }
  if(source.length === 0) {
    alert("この条件に合う問題がありません。");
    return;
  }

  const base = order === "random" ? shuffle(source) : [...source];
  currentQuestions = countValue === "all" ? base : base.slice(0, Number(countValue));
  currentIndex = 0;

  document.getElementById("settingBox").classList.add("hidden");
  document.getElementById("testArea").classList.remove("hidden");
  document.getElementById("answerBox").classList.add("hidden");
  document.getElementById("allBox").classList.add("hidden");
  document.getElementById("missBox").classList.add("hidden");
  document.getElementById("retestBadge").classList.toggle("hidden", !retest);

  updateHeader();
  showQuestion();
  showAllList();
  showMisses();
  window.scrollTo({top:0,behavior:"smooth"});
}

function updateHeader() {
  document.getElementById("modeBadge").textContent = currentMode === "read" ? "読み" : "書き";
  document.getElementById("rangeBadge").textContent = document.getElementById("rangeSelect").selectedOptions[0].textContent;
  const instruction = document.getElementById("instruction");
  if(currentMode === "read") {
    instruction.textContent = "文章中の【漢字・語句】の読みを書きます。基本練習と実戦練習は混ぜて出題されます。";
  } else {
    instruction.textContent = "文章中の【カタカナ・ひらがな】を漢字に直します。基本練習と実戦練習は混ぜて出題されます。";
  }
}

function markTarget(text) {
  return escapeHtml(text).replace(/【/g, "<span class='target'>【").replace(/】/g, "】</span>");
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById("progress").textContent = "進行状況：" + (currentIndex+1) + " / " + currentQuestions.length;
  document.getElementById("num").textContent = "問" + (currentIndex+1) + "　" + q.lesson + "・" + q.page + "ページ";
  document.getElementById("answerBox").classList.add("hidden");

  document.getElementById("label2").textContent = (currentMode === "read" ? "読み" : "書き") + "（" + q.kind + "）";
  document.getElementById("question").innerHTML = markTarget(q.sentence);
  document.getElementById("answerMain").textContent = q.answer;
  document.getElementById("answerSub").innerHTML =
    "<strong>語句：</strong>" + escapeHtml(q.word) +
    "<br><strong>読み：</strong>" + escapeHtml(q.reading) +
    "<br><strong>中心の漢字：</strong>" + escapeHtml(q.kanji) +
    "<br><strong>漢字の読み：</strong>" + escapeHtml(q.readings) +
    "<br><strong>出題元：</strong>" + escapeHtml(q.kind) + "練習";
}

function toggleAnswer() {
  document.getElementById("answerBox").classList.toggle("hidden");
}

function markCurrentMiss() {
  const q = currentQuestions[currentIndex];
  addMiss(q);
  alert("保存しました： " + q.word + "（" + q.kind + "・" + (q.mode === "read" ? "読み" : "書き") + "）");
}

function removeCurrentMiss() {
  const q = currentQuestions[currentIndex];
  removeMiss(q);
  alert("削除しました： " + q.word);
}

function nextQuestion() {
  if(currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    showQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    alert("最後の問題です。");
  }
}

function prevQuestion() {
  if(currentIndex > 0) {
    currentIndex--;
    showQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    alert("最初の問題です。");
  }
}

function showAllList() {
  const list = document.getElementById("allList");
  list.innerHTML = "";
  questions.forEach(q => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = "<span class='item-kanji'>" + escapeHtml(q.kanji) + "</span>　" +
      escapeHtml(q.readings) +
      "<br><strong>" + escapeHtml(q.lesson) + " / " + escapeHtml(q.page) + "ページ / " + escapeHtml(q.kind) + " / " + (q.mode === "read" ? "読み" : "書き") + "</strong>" +
      "<br>語句：" + escapeHtml(q.word) + "（" + escapeHtml(q.reading) + "）";
    list.appendChild(div);
  });
}

function showMisses() {
  const list = document.getElementById("missList");
  list.innerHTML = "";
  const miss = getMissItems();
  if(miss.length === 0) {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = "保存中の間違いはありません。";
    list.appendChild(div);
    return;
  }
  miss.forEach(q => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = "<span class='item-kanji'>" + escapeHtml(q.kanji) + "</span>　" +
      escapeHtml(q.word) +
      "<br>" + escapeHtml(q.lesson) + " / " + escapeHtml(q.page) + "ページ / " + escapeHtml(q.kind) + " / " + (q.mode === "read" ? "読み" : "書き") +
      "<br>答え：" + escapeHtml(q.answer);
    list.appendChild(div);
  });
}

function toggleAllList() { document.getElementById("allBox").classList.toggle("hidden"); }
function toggleMisses() { showMisses(); document.getElementById("missBox").classList.toggle("hidden"); }

function backToSetting() {
  document.getElementById("settingBox").classList.remove("hidden");
  document.getElementById("testArea").classList.add("hidden");
  updateMemoryInfo();
  window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

document.addEventListener("keydown", function(event) {
  if(document.getElementById("testArea").classList.contains("hidden")) return;
  if(event.key === "ArrowRight" || event.key === "Enter") nextQuestion();
  if(event.key === "ArrowLeft") prevQuestion();
  if(event.key === " ") {
    event.preventDefault();
    toggleAnswer();
  }
});

updateMemoryInfo();
</script>
